---
- name: Update proxy settings
  hosts:
    - all:!proxies
  become: true
  gather_facts: true
  serial:
    - 1
  tags:
    - proxy
  handlers:
    - name: Reboot
      ansible.builtin.reboot:
        msg: "Rebooting to apply proxy settings"
        pre_reboot_delay: 5
        reboot_timeout: 600
  tasks:
    - name: Configure environment variables
      ansible.builtin.lineinfile:
        dest: /etc/environment
        line: "{{ item }}"
        regexp: "^{{ item.split('=')[0] }}="
        create: true
      with_items:
        - "http_proxy=http://{{ internet_proxy }}"
        - "https_proxy=http://{{ internet_proxy }}"
        - "ftp_proxy=ftp://{{ internet_proxy }}"
        - "no_proxy={{ no_proxy }}"
      notify: Reboot

    - name: Configure update k3s service .env file
      register: k3s_env_file
      failed_when: false
      ansible.builtin.lineinfile:
        dest: /etc/systemd/system/k3s.service.env
        line: "{{ item }}"
        regexp: "^{{ item.split('=')[0] }}="
        create: false
      with_items:
        - "http_proxy=http://{{ internet_proxy }}"
        - "https_proxy=http://{{ internet_proxy }}"
        - "no_proxy={{ no_proxy }}"
      notify:
        - Reboot

    - name: Configure docker daemon proxy
      register: docker_proxy_file
      failed_when: docker_proxy_file.rc != 257 and docker_proxy_file.rc != 0
      ansible.builtin.lineinfile:
        dest: /etc/systemd/system/docker.service.d/http-proxy.conf
        line: "{{ item }}"
        regexp: "^{{ item.split('=')[0] }}="
        create: false
      with_items:
        - "HTTP_PROXY=http://{{ internet_proxy }}"
        - "HTTPS_PROXY=http://{{ internet_proxy }}"
        - "NO_PROXY={{ no_proxy }}"
      notify:
        - Reboot
